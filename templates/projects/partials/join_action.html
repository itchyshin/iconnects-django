{% if pending_invitation %}
  <form method="post"
        action="{% url 'projects:accept_or_decline' code=pending_invitation.invitation_code %}">
    {% csrf_token %}
    <button type="submit" name="action" value="decline" class="btn btn-sm btn-ghost">
      Decline invitation
    </button>
    <button type="submit" name="action" value="accept"
            class="btn btn-sm bg-brand-coral hover:bg-brand-coral/90 text-white border-0">
      Accept invitation
    </button>
  </form>
{% elif pending_join_request %}
  <span class="inline-flex items-center px-3 py-1.5 rounded-md text-sm font-medium bg-brand-light/60 text-brand-text">
    Request pending ({{ pending_join_request.get_requested_privilege_display }})
  </span>
  <form method="post"
        action="{% url 'projects:cancel_join_request' join_request_pk=pending_join_request.pk %}"
        hx-post="{% url 'projects:cancel_join_request' join_request_pk=pending_join_request.pk %}"
        hx-target="#join-action"
        hx-swap="innerHTML">
    {% csrf_token %}
    <button type="submit" class="btn btn-sm btn-ghost">Cancel request</button>
  </form>
{% else %}
  <button type="button"
          class="btn btn-sm bg-brand-coral hover:bg-brand-coral/90 text-white border-0"
          hx-get="{% url 'projects:request_to_join' pk=project.pk %}"
          hx-target="#join-request-modal-body"
          hx-swap="innerHTML"
          onclick="document.getElementById('join-request-modal').showModal()">
    Request to join
  </button>
{% endif %}
