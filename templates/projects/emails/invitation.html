{% autoescape on %}
<p>Hi,</p>
<p>
  <strong>{{ invitation.added_by }}</strong> invited you to join the project
  <strong>{{ project.name }}</strong> on i-connects as
  a <em>{{ invitation.get_privilege_display }}</em>.
</p>
<p>
  <a href="{{ url }}">Accept or decline the invitation</a>
</p>
<p style="color:#888">If you weren't expecting this email, you can ignore it.</p>
<p>— i-connects</p>
{% endautoescape %}
