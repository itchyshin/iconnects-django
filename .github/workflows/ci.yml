name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # celery[redis] declares kombu's redis-py range, so a pin that kombu
      # rejects at runtime (and only at runtime) fails here instead.
      - name: Check installed dependencies are compatible
        run: pip check

      - name: Check for model changes missing a migration
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

      - name: Run pytest
        run: pytest -q

  css:
    name: Tailwind CSS build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          # Same major as the Dockerfile's css-builder stage.
          node-version: "22"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Build CSS
        run: npm run build:css

      - name: Verify output.css was produced
        run: test -f static/css/output.css

  compose:
    name: Compose config and scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create a throwaway .env
        run: |
          cp .env.example .env
          sed -i 's/^REDIS_PASSWORD=.*/REDIS_PASSWORD=ci-only/' .env

      - name: Development stack renders
        run: docker compose -f docker-compose.yml config --quiet

      - name: Production stack renders
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

      - name: Rendered service commands contain no embedded newlines
        # A folded YAML block (`>`) keeps line breaks when continuation lines are
        # indented deeper than the first, and `sh -c` then runs each line as a
        # separate command. This caught nothing until it broke a launch; keep it.
        run: |
          for files in "-f docker-compose.yml" "-f docker-compose.yml -f docker-compose.prod.yml"; do
            docker compose $files config --format json | python3 -c "import json,sys; s=json.load(sys.stdin)['services']; bad=[n for n,v in s.items() if any('\n' in p for p in (v.get('command') or []))]; sys.exit('multi-line command in: %s' % bad if bad else 0)"
          done

      - name: Production stack refuses to render without REDIS_PASSWORD
        run: |
          sed -i 's/^REDIS_PASSWORD=.*/REDIS_PASSWORD=/' .env
          if docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet 2>/dev/null; then
            echo "expected 'config' to fail with an empty REDIS_PASSWORD" >&2
            exit 1
          fi

      - name: Shell scripts parse
        run: bash -n scripts/*.sh scripts/tests/*.sh

  offsite:
    name: Off-site backup script
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install rclone
        # Ubuntu's package, the same version cossee-web-server gets (GDRIVE_BACKUP.md).
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rclone

      - name: Shellcheck
        run: shellcheck -S warning scripts/*.sh scripts/tests/*.sh

      - name: offsite-sync.sh against a local encrypted remote
        run: scripts/tests/test-offsite-sync.sh

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build
        run: docker build --tag i-connects:ci .

      - name: Static files were collected at build time
        run: docker run --rm i-connects:ci test -f /app/staticfiles/staticfiles.json

      - name: Runs as appuser
        run: docker run --rm i-connects:ci id -u | grep -qx 1000

      - name: Start script is present and executable
        run: docker run --rm i-connects:ci test -x /app/scripts/start-web.sh

      - name: Django system checks pass without a database
        run: docker run --rm -e DJANGO_SECRET_KEY=ci-only -e DJANGO_ALLOWED_HOSTS=ci i-connects:ci python manage.py check
